name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token needs nothing more than reading the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The keychain backend takes a different code path on every platform,
        # and the vault fallback only triggers where no keychain answers.
        # Running one OS would leave two of the three untested.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        # No version pin: pnpm/action-setup reads packageManager from
        # package.json, so the lockfile and CI can never disagree.

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Verify the shebang survived bundling
        shell: bash
        run: |
          # A CLI whose first line is not a shebang installs fine and then
          # fails to execute. Cheap to check, expensive to discover after
          # publishing.
          head -1 dist/cli.js | grep -qx '#!/usr/bin/env node' \
            || { echo "::error::dist/cli.js is missing its shebang"; exit 1; }
